<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南龙翔电气股份有限公司后台登录</title>
    <link rel="icon" type="image/webp" href="../assets/optimized/longxiang-logo-symbol-320.webp?v=20260618-imgopt2">
    <link rel="stylesheet" href="css/admin.css?v=20260628-stage7c">
</head>
<body>
    <div class="login-page" id="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>龙翔电气 <span style="color:#D4A843;">后台</span></h1>
                    <p>河南龙翔电气股份有限公司网站管理入口</p>
                </div>
                <div class="login-error" id="login-error"></div>
                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn-login" id="btn-login">登录</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/admin.js?v=2"></script>
</body>
</html>
