<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review Longxiang product specifications, applications and inquiry details for transformers, switchgear, EV charging and energy equipment.">
    <title>Product Details | Longxiang Electrical</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260615-lxdq">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20260615-lxdq">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260615-lxdq">
    <link rel="stylesheet" href="css/styles.css?v=20260710-contact-bar-instagram">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <span class="nav-logo-text">LONG<span>XIANG</span></span>
            </a>
            <div class="nav-links" aria-live="polite"></div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>
    <div class="mobile-menu-overlay"></div>


    <section class="page-hero">
        <div class="page-hero-pattern"></div>
        <div class="container">
            <div class="breadcrumb" aria-live="polite"><span class="current" id="breadcrumb-product">Product Details</span></div>
            <p class="page-hero-title" id="page-title">Product Details</p>
            <p id="page-subtitle">Review product information, specifications and inquiry details.</p>
        </div>
    </section>
    <main data-content-page="product-pages" data-product-page-kind="detail">
        <section class="product-detail-section">
            <div class="container">
                <div class="product-detail-layout product-detail-redesign">
                    <article class="product-detail-content-card">
                        <div class="product-detail-main-image"><img id="main-product-image" src="" alt="" width="960" height="720" decoding="async" fetchpriority="high"></div>
                        <div class="product-section-block">
                            <h1 id="product-title">Product Details</h1>
                            <div class="product-detail-desc" id="product-desc"><p>Review product information, specifications and inquiry details.</p></div>
                            <div class="product-decision-summary" data-product-decision-summary></div>
                        </div>
                        <div class="product-section-block product-applications-block" data-product-applications></div>
                        <div class="product-section-block product-selection-block" data-product-selection></div>
                        <div class="product-section-block product-detail-specs">
                            <h2 data-product-specs-title></h2>
                            <table class="product-specs-table" id="specs-table"><tbody id="specs-body"></tbody></table>
                        </div>
                        <div class="product-section-block export-support-block" data-product-detail-support>
                            <div class="empty-state"></div>
                        </div>
                        <div class="product-section-block faq-block" data-product-detail-faq>
                            <div class="empty-state"></div>
                        </div>
                        <div class="product-section-block product-related-block" data-product-related></div>
                    </article>
                    <aside class="product-detail-sidebar" data-product-detail-inquiry>
                        <div class="empty-state"></div>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid" aria-live="polite"></div>
            <div class="footer-bottom"><p></p></div>
        </div>
    </footer>
    <button class="back-to-top" aria-label="Back to top">&uarr;</button>
    <script src="js/main.js?v=20260710-contact-bar"></script>
    <script src="js/content-pages.js?v=20260705-seo-stage3-fix"></script>
    <script src="js/product-detail.js?v=20260706-product-page-schema"></script>
</body>
</html>
