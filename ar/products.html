<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title>Longxiang</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=20260615-lxdq">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png?v=20260615-lxdq">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=20260615-lxdq">
    <link rel="stylesheet" href="../css/styles.css?v=20260619-rtl1">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <span class="nav-logo-text">LONG<span>XIANG</span></span>
            </a>
            <div class="nav-links" aria-live="polite"></div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>
    <div class="mobile-menu-overlay"></div>


    <section class="page-hero">
        <div class="page-hero-pattern"></div>
        <div class="container">
            <div class="breadcrumb" aria-live="polite"></div>
            <h1></h1>
            <p></p>
        </div>
    </section>
    <main data-content-page="product-pages" data-product-page-kind="listing">
        <section class="section bg-light product-directory-section">
            <div class="container product-directory-container">
                <button type="button" class="product-category-toggle" aria-controls="product-category-tree" aria-expanded="false">
                    كل الفئات
                </button>
                <div class="product-catalog-layout product-directory-layout">
                    <aside class="product-tree product-directory-tree fade-in" id="product-category-tree" aria-label="فئات المنتجات">
                        <button type="button" class="product-category-close" aria-label="إغلاق فئات المنتجات">×</button>
                        <div class="product-tree-title">فئات المنتجات</div>
                        <div class="product-tree-body">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </aside>
                    <div class="catalog-content product-directory-content">
                        <div class="catalog-toolbar product-directory-toolbar fade-in">
                            <div class="catalog-heading">
                                <h2 id="catalog-title">المحولات</h2>
                                <p id="catalog-summary">تصفح مجموعة معدات توزيع الطاقة الكاملة.</p>
                            </div>
                            <div class="catalog-search-form" role="search">
                                <input class="catalog-search" id="catalog-search" type="search" placeholder="ابحث باسم المنتج أو الموديل" aria-label="البحث في المنتجات">
                                <button type="button" class="catalog-search-submit">بحث</button>
                            </div>
                        </div>
                        <div class="catalog-filter-status fade-in" aria-live="polite" hidden>
                            <span class="catalog-filter-label">التصفية الحالية:</span>
                            <span id="catalog-current-filter">المحولات</span>
                            <button type="button" class="catalog-clear-filters">مسح التصفية</button>
                        </div>
                        <div class="products-catalog-grid" data-stagger="100" id="products-container"></div>
                        <nav class="catalog-pagination" aria-label="ترقيم صفحات المنتجات"></nav>
                    </div>
                </div>
            </div>
        </section>
        <section class="section product-export-note" data-product-listing-support>
        </section>
        <section class="cta-section" data-product-listing-cta>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid" aria-live="polite"></div>
            <div class="footer-bottom"><p></p></div>
        </div>
    </footer>
    <button class="back-to-top" aria-label="العودة إلى الأعلى">&uarr;</button>
    <script src="../js/main.js?v=20260619-rtl1"></script>
    <script src="../js/content-pages.js?v=20260616-shell7"></script>
    <script src="../js/products-list.js?v=20260619-rtl1"></script>
</body>
</html>
